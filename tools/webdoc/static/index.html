<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>달빛쉘터 SEO</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div>
        <h1>달빛쉘터 SEO</h1>
        <p class="sub">템플릿 대량 발행 · public/seo-data · Blob · IndexNow</p>
      </div>
      <div class="top-actions">
        <span id="statusBadge" class="badge">준비됨</span>
        <button type="button" id="btnShutdown" class="btn ghost">프로그램 종료</button>
      </div>
    </header>

    <section class="card">
      <h2>사이트</h2>
      <label>사이트 URL
        <input id="siteUrl" type="text" placeholder="https://sesan.agapet.co.kr" />
      </label>
      <label>이미지 URL
        <input id="imageUrl" type="text" placeholder="https://image.cattery.co.kr/dogboho" />
      </label>
      <p class="field-note">폴더 URL → 01.webp~ 개수 자동 확인 후 랜덤 / 파일 URL(.webp·.jpg 등) → 고정 1장</p>
      <label>이미지 개수 (비우면 자동)
        <input id="imageCount" type="number" min="0" placeholder="자동 (예: 79)" />
      </label>
      <label>출력 폴더
        <input id="outDir" type="text" />
      </label>
      <p class="field-note">발행 시 항상 프로젝트 public/seo-data 에 동기화됩니다. Blob 토큰이 있으면 운영 사이트에도 즉시 반영됩니다.</p>
    </section>

    <section class="card">
      <h2>키워드</h2>
      <div class="row3">
        <label>발행 건수 (비우면 전체)
          <input id="count" type="number" min="0" placeholder="전체" />
        </label>
        <label class="checks">
          <span class="check"><input type="checkbox" id="doIndexnow" checked /> IndexNow 즉시 전송</span>
        </label>
      </div>
      <textarea id="keywords" rows="12" placeholder="한 줄에 키워드 하나&#10;예: 강아지파양&#10;무료분양&#10;서울강아지보호소"></textarea>
      <div class="actions">
        <button type="button" id="btnSave" class="btn ghost">설정 저장</button>
        <button type="button" id="btnRun" class="btn primary">대량 발행 시작</button>
      </div>
    </section>

    <section class="card">
      <h2>로그 · 발행 URL</h2>
      <pre id="log" class="log"></pre>
      <div class="url-toolbar">
        <button type="button" id="btnCopyUrls" class="btn ghost" disabled>전체 URL 복사</button>
        <span id="urlCopyHint" class="hint"></span>
      </div>
      <div id="urls" class="urls"></div>
    </section>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
